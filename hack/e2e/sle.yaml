images:
# Pinned to a numbered build: the unversioned "-Cloud.qcow2" URL is replaced on
# every rebuild, which breaks the digest check. Bump build and digest together
# (digests: <location>.sha256) when openSUSE removes this build.

- location: https://download.opensuse.org/distribution/leap/16.0/appliances/Leap-16.0-Minimal-VM.x86_64-Cloud-Build18.92.qcow2
  arch: x86_64
  digest: "sha256:6714d7daceefffa9648d52b213bea017da0a23ef728aed32b4fb68f0f03b9ae2"

- location: https://download.opensuse.org/distribution/leap/16.0/appliances/Leap-16.0-Minimal-VM.aarch64-Cloud-Build18.92.qcow2
  arch: aarch64
  digest: "sha256:acddc5239334e6cc0d2c040861bb7c1bb19bdcc039793b8e6997abba0e06962f"

provision:
- mode: system
  script: |
    zypper --gpg-auto-import-keys ref
    # install openssl for helm setup (error: please install openssl or set VERIFY_CHECKSUM=false in your environment.Failed to install helm)
    # install iptables for rke2-ingress-nginx-controller-8zlzd (error: executable file not found in $PATH)
    zypper --non-interactive install -y openssl iptables
